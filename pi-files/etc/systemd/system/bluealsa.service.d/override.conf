# Xiaomi Sound Bridge: Bluetooth A2DP source (sender) only.
# /usr/local/bin/bluealsa: BlueALSA 4.3.1 built with AAC (fdk-aac), see
# setup/build-bluealsa-aac.sh; Debian's package has SBC only. BLUEALSA_OPTS
# in /etc/xsb/xsb.conf selects the codec (-c AAC) and the other options:
# --a2dp-force-mono gives each speaker one channel; --sbc-quality only
# matters when SBC is used.
# --a2dp-volume makes each speaker's PCM use the speaker's own AVRCP absolute
# volume from the start; xsb-volume-sync then keeps the speakers' levels in
# step. --keep-alive keeps the A2DP stream up briefly between client reopens.
# Real-time scheduling: gaps in the stream are audible.
[Service]
EnvironmentFile=-/etc/xsb/xsb.conf
ExecStart=
ExecStart=/usr/local/bin/bluealsa -S -p a2dp-source $BLUEALSA_OPTS
CPUSchedulingPolicy=fifo
CPUSchedulingPriority=50
