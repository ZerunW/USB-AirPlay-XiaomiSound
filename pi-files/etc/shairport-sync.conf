// Xiaomi Sound Bridge: shairport-sync (AirPlay 2) configuration.
// Only settings that differ from the defaults are listed. Full reference:
// https://github.com/mikebrady/shairport-sync/blob/master/scripts/shairport-sync.conf

general =
{
	name = "Xiaomi Sound Bridge";
	output_backend = "alsa";
	interpolation = "auto"; // picks soxr only if the CPU is fast enough
	// Volume is applied on the speakers themselves (AVRCP absolute volume),
	// both kept equal by xsb-volume-sync: pass audio at full level and hand
	// the AirPlay volume (-30..0, -144 = mute) to the sync script.
	ignore_volume_control = "yes";
	run_this_when_volume_is_set = "/usr/local/sbin/xsb-volume-sync airplay ";
};

sessioncontrol =
{
	// AirPlay has priority: stop USB forwarding (freeing the BlueALSA PCM,
	// which allows only one client) before AirPlay audio starts.
	run_this_before_play_begins = "/usr/bin/sudo -n /usr/local/sbin/xsb-source-switch.sh airplay";
	// Resume USB forwarding once AirPlay has been idle for active_state_timeout
	// seconds, so short pauses / track changes don't bounce the sources.
	run_this_after_exiting_active_state = "/usr/bin/sudo -n /usr/local/sbin/xsb-source-switch.sh usb";
	active_state_timeout = 5.0;
	wait_for_completion = "yes";
};

alsa =
{
	// plug -> ALSA Loopback -> xsb-bt-stream -> speaker (see /etc/alsa/conf.d/60-xsb.conf)
	output_device = "xsb_airplay";
	// The A2DP link runs at 48 kHz; let shairport-sync convert from 44.1 kHz.
	output_rate = 48000;
	output_format = "S16_LE";
	// Release the Loopback when idle so USB forwarding can open it.
	disable_standby_mode = "never";
};
