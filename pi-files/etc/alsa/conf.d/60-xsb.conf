# Xiaomi Sound Bridge ALSA configuration.
#
# Audio sources (shairport-sync, USB forwarding) write stereo into the ALSA
# Loopback card (one substream: only one source at a time). While a source
# plays, the xsb-bt-stream@ instances carry the audio to the speakers: one
# instance per speaker (@left and @right).

# shairport-sync output (it already produces 48 kHz S16_LE stereo).
pcm.xsb_airplay {
    type plug
    slave {
        pcm "hw:CARD=Loopback,DEV=0"
        rate 48000
        format S16_LE
        channels 2
    }
}

# The Loopback capture side, shared by the left and right streams.
# dsnoop lets both read the same stereo signal on one clock, so the two
# channels can never drift apart inside the Pi.
pcm.xsb_cap {
    type dsnoop
    ipc_key 7353
    ipc_perm 0666
    slave {
        pcm "hw:CARD=Loopback,DEV=1"
        channels 2
        rate 48000
        format S16_LE
        period_size 960
        buffer_size 9600
    }
}
pcm.xsb_cap_left {
    type route
    slave { pcm "xsb_cap" channels 2 }
    ttable.0.0 1
}
pcm.xsb_cap_right {
    type route
    slave { pcm "xsb_cap" channels 2 }
    ttable.0.1 1
}

# One speaker over Bluetooth: xsb_bt:MAC=XX:XX:XX:XX:XX:XX. plug converts the
# rate if the A2DP link ever runs at 44.1 kHz, and the channel count (the link
# is mono in dual mode). The default MAC 00:00:00:00:00:00 means "most recently
# connected device" to BlueALSA.
pcm.xsb_bt {
    @args [ MAC ]
    @args.MAC { type string default "00:00:00:00:00:00" }
    type plug
    slave.pcm {
        @func concat
        strings [ "bluealsa:DEV=" $MAC ",PROFILE=a2dp" ]
    }
    rate_converter "speexrate_medium"
}

