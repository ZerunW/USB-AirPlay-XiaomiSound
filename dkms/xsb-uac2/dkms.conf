# Xiaomi Sound Bridge: rebuild the kernel's UAC2 gadget function (usb_f_uac2)
# with the streaming-interface names taken from configfs "function_name"
# instead of the hard-coded "Playback Inactive"/"Playback Active", so macOS
# lists the device as "Xiaomi Sound Bridge".
PACKAGE_NAME="xsb-uac2"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="usb_f_uac2"
DEST_MODULE_LOCATION[0]="/updates/dkms"
PRE_BUILD="prepare-sources.sh ${kernelver}"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
# Only the 32-bit Raspberry Pi kernel flavour this project boots (Pi Zero 2 W
# on 32-bit Raspberry Pi OS). Other installed flavours (e.g. arm64 v8 headers
# on an armhf userland) are skipped instead of failing. Adjust for 64-bit OS.
BUILD_EXCLUSIVE_KERNEL="-rpi-v7$"
AUTOINSTALL="yes"
